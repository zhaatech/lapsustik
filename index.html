<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lapas Narkotika Jayapura - Kemenkumham RI</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />

        <style>
            /* ===== BASE ===== */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            * {
                font-family: "Inter", sans-serif;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                overflow-x: hidden;
                transition:
                    background-color 0.4s,
                    color 0.4s;
            }
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: var(--bg-primary);
            }
            ::-webkit-scrollbar-thumb {
                background: #f59e0b55;
                border-radius: 3px;
            }
            [x-cloak] {
                display: none !important;
            }

            /* ===== THEME VARIABLES ===== */
            :root {
                --gold: #f59e0b;
                --gold-dark: #d97706;
                --gold-light: #fbbf24;
            }

            /* DARK MODE (default) */
            body.dark {
                --bg-primary: #0a0f1e;
                --bg-secondary: #0d1323;
                --bg-card: #111827;
                --bg-card2: #0f1729;
                --text-primary: #ffffff;
                --text-secondary: #9ca3af;
                --text-muted: #6b7280;
                --border: rgba(255, 255, 255, 0.08);
                --border-card: rgba(255, 255, 255, 0.1);
                --nav-bg: rgba(10, 15, 30, 0.96);
                --hero-gradient: radial-gradient(
                    ellipse at 55% 40%,
                    #182040 0%,
                    #0a0f1e 65%
                );
                --card-gradient: linear-gradient(
                    135deg,
                    #111827 0%,
                    #0f1729 100%
                );
                --input-bg: #070c1a;
                --faq-border: #1e2a40;
                --org-avatar-bg: linear-gradient(135deg, #1a2540, #0f1729);
                --shadow-gold: rgba(245, 158, 11, 0.15);
                --btn-secondary-border: rgba(255, 255, 255, 0.25);
                --btn-secondary-color: #ffffff;
                --particle-color: rgba(245, 158, 11, 0.5);
            }

            /* LIGHT MODE */
            body.light {
                --bg-primary: #f8f9fc;
                --bg-secondary: #eef0f7;
                --bg-card: #ffffff;
                --bg-card2: #f1f3fa;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --border: rgba(0, 0, 0, 0.07);
                --border-card: rgba(0, 0, 0, 0.09);
                --nav-bg: rgba(248, 249, 252, 0.96);
                --hero-gradient: radial-gradient(
                    ellipse at 55% 40%,
                    #dde6ff 0%,
                    #f0f3fb 65%
                );
                --card-gradient: linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f5f7ff 100%
                );
                --input-bg: #f8f9fc;
                --faq-border: #e2e8f0;
                --org-avatar-bg: linear-gradient(135deg, #e0e7ff, #f0f3fb);
                --shadow-gold: rgba(245, 158, 11, 0.2);
                --btn-secondary-border: rgba(0, 0, 0, 0.2);
                --btn-secondary-color: #0f172a;
                --particle-color: rgba(245, 158, 11, 0.3);
            }

            body {
                background-color: var(--bg-primary);
                color: var(--text-primary);
            }

            /* ===== NAV ===== */
            .nav-fixed {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000;
                background-color: var(--nav-bg);
                backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--border);
                transition:
                    background-color 0.4s,
                    border-color 0.4s,
                    box-shadow 0.4s;
            }
            .nav-scrolled {
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
            }
            .nav-link {
                color: var(--text-primary);
                transition: color 0.3s;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
            }
            .nav-link:hover {
                color: var(--gold);
            }

            /* ===== BUTTONS ===== */
            .btn-primary {
                background-color: var(--gold);
                color: #000;
                font-weight: 700;
                transition:
                    background-color 0.3s,
                    transform 0.2s,
                    box-shadow 0.3s;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 28px;
                border-radius: 12px;
                font-size: 15px;
                text-decoration: none;
                border: none;
                cursor: pointer;
            }
            .btn-primary:hover {
                background-color: var(--gold-dark);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
            }
            .btn-secondary {
                background-color: transparent;
                border: 1.5px solid var(--btn-secondary-border);
                color: var(--btn-secondary-color);
                font-weight: 600;
                transition:
                    border-color 0.3s,
                    transform 0.2s,
                    color 0.3s,
                    box-shadow 0.3s;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 28px;
                border-radius: 12px;
                font-size: 15px;
                text-decoration: none;
                cursor: pointer;
            }
            .btn-secondary:hover {
                border-color: var(--gold);
                color: var(--gold);
                transform: translateY(-2px);
            }

            /* ===== ICONS & CARDS ===== */
            .icon-box {
                background-color: var(--gold);
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 52px;
                height: 52px;
                flex-shrink: 0;
            }
            .icon-box-sm {
                background-color: rgba(245, 158, 11, 0.12);
                border: 1px solid rgba(245, 158, 11, 0.28);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                flex-shrink: 0;
            }
            .divider-gold {
                width: 60px;
                height: 3px;
                background: linear-gradient(to right, #f59e0b, #d97706);
                border-radius: 2px;
            }
            .section-label {
                color: var(--gold);
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .data-card {
                background: var(--bg-card);
                border: 1px solid var(--border-card);
                border-radius: 18px;
                transition:
                    transform 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
                    border-color 0.3s,
                    box-shadow 0.35s;
            }
            .data-card:hover {
                transform: translateY(-6px);
                border-color: var(--gold);
                box-shadow: 0 12px 40px var(--shadow-gold);
            }
            .data-card.active {
                border-color: var(--gold);
            }

            .zone-card {
                background: var(--card-gradient);
                border: 1px solid var(--border-card);
                border-radius: 16px;
                padding: 28px;
                transition:
                    transform 0.35s cubic-bezier(0.22, 0.68, 0, 1.2),
                    border-color 0.3s,
                    box-shadow 0.35s;
            }
            .zone-card:hover {
                border-color: var(--gold);
                transform: translateY(-6px);
                box-shadow: 0 12px 40px var(--shadow-gold);
            }

            /* ===== GALLERY ===== */
            .gallery-filter-btn {
                border: 1.5px solid var(--border-card);
                border-radius: 999px;
                padding: 8px 20px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.3s;
                color: var(--text-primary);
                background: transparent;
            }
            .gallery-filter-btn.active {
                background-color: var(--gold);
                border-color: var(--gold);
                color: #000;
                font-weight: 700;
            }
            .gallery-filter-btn:not(.active):hover {
                border-color: var(--gold);
                color: var(--gold);
            }
            .gallery-item {
                overflow: hidden;
                border-radius: 18px;
            }
            .gallery-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition:
                    transform 0.6s cubic-bezier(0.22, 0.68, 0, 1.2),
                    filter 0.4s;
            }
            .gallery-item:hover img {
                transform: scale(1.08);
                filter: brightness(1.05);
            }

            /* ===== FAQ ===== */
            .faq-item {
                border: 1px solid var(--faq-border);
                border-radius: 14px;
                overflow: hidden;
                transition:
                    border-color 0.3s,
                    box-shadow 0.3s;
                background: var(--bg-card);
            }
            .faq-item:hover {
                border-color: rgba(245, 158, 11, 0.4);
                box-shadow: 0 4px 20px var(--shadow-gold);
            }

            /* ===== ORG ===== */
            .org-avatar {
                width: 80px;
                height: 80px;
                border-radius: 14px;
                background: var(--org-avatar-bg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                font-weight: 800;
                color: var(--gold);
                border: 2px solid rgba(245, 158, 11, 0.35);
            }
            .org-avatar-sm {
                width: 60px;
                height: 60px;
                border-radius: 12px;
                background: var(--org-avatar-bg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                font-weight: 800;
                color: var(--gold);
                border: 2px solid rgba(245, 158, 11, 0.3);
            }

            /* ===== THEME TOGGLE ===== */
            .theme-toggle {
                width: 52px;
                height: 28px;
                border-radius: 999px;
                border: 2px solid var(--gold);
                background: transparent;
                position: relative;
                cursor: pointer;
                transition: background 0.4s;
                display: flex;
                align-items: center;
                padding: 2px;
            }
            .theme-toggle-thumb {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: var(--gold);
                transition: transform 0.4s cubic-bezier(0.22, 0.68, 0, 1.2);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                flex-shrink: 0;
            }
            body.light .theme-toggle-thumb {
                transform: translateX(24px);
            }

            /* ===== FOOTER ===== */
            .footer-link {
                color: var(--text-secondary);
                transition: color 0.3s;
                font-size: 14px;
                text-decoration: none;
                display: block;
            }
            .footer-link:hover {
                color: var(--gold);
            }

            /* ===== INPUT ===== */
            .form-input {
                width: 100%;
                background: var(--input-bg);
                border: 1px solid var(--border-card);
                border-radius: 12px;
                padding: 12px 16px;
                color: var(--text-primary);
                font-size: 14px;
                transition:
                    border-color 0.3s,
                    box-shadow 0.3s;
                outline: none;
            }
            .form-input:focus {
                border-color: var(--gold);
                box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
            }
            .form-input::placeholder {
                color: var(--text-muted);
            }
            .form-label {
                font-size: 13px;
                color: var(--text-secondary);
                margin-bottom: 5px;
                display: block;
                font-weight: 500;
            }

            /* ===== ANIMATIONS ===== */
            /* Scroll-triggered */
            .anim-fade {
                opacity: 0;
                transform: translateY(36px);
                transition:
                    opacity 0.75s ease,
                    transform 0.75s ease;
            }
            .anim-left {
                opacity: 0;
                transform: translateX(-50px);
                transition:
                    opacity 0.75s ease,
                    transform 0.75s ease;
            }
            .anim-right {
                opacity: 0;
                transform: translateX(50px);
                transition:
                    opacity 0.75s ease,
                    transform 0.75s ease;
            }
            .anim-scale {
                opacity: 0;
                transform: scale(0.88);
                transition:
                    opacity 0.65s ease,
                    transform 0.65s ease;
            }
            .anim-flip {
                opacity: 0;
                transform: rotateX(20deg) translateY(24px);
                transition:
                    opacity 0.7s ease,
                    transform 0.7s ease;
            }
            .visible {
                opacity: 1 !important;
                transform: none !important;
            }

            .d1 {
                transition-delay: 0.05s;
            }
            .d2 {
                transition-delay: 0.15s;
            }
            .d3 {
                transition-delay: 0.25s;
            }
            .d4 {
                transition-delay: 0.35s;
            }
            .d5 {
                transition-delay: 0.45s;
            }
            .d6 {
                transition-delay: 0.55s;
            }
            .d7 {
                transition-delay: 0.65s;
            }
            .d8 {
                transition-delay: 0.75s;
            }

            /* Pulse glow on gold badge */
            @keyframes pulse-gold {
                0%,
                100% {
                    box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5);
                }
                50% {
                    box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
                }
            }
            .pulse-badge {
                animation: pulse-gold 2.5s infinite;
            }

            /* Floating hero image */
            @keyframes float {
                0%,
                100% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-10px);
                }
            }
            .hero-float {
                animation: float 5s ease-in-out infinite;
            }

            /* Rotating glow ring */
            @keyframes spin-slow {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .spin-slow {
                animation: spin-slow 14s linear infinite;
            }

            /* Stat number shimmer */
            @keyframes shimmer {
                0% {
                    background-position: -200% center;
                }
                100% {
                    background-position: 200% center;
                }
            }
            .stat-num {
                font-size: 2.5rem;
                font-weight: 900;
                background: linear-gradient(
                    90deg,
                    #f59e0b 30%,
                    #fbbf24 50%,
                    #f59e0b 70%
                );
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shimmer 3s linear infinite;
            }

            /* Particle canvas */
            #particles {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 0;
            }

            /* Typing cursor */
            @keyframes blink {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
            }
            .cursor {
                display: inline-block;
                width: 3px;
                height: 1em;
                background: var(--gold);
                margin-left: 3px;
                animation: blink 0.9s infinite;
                vertical-align: middle;
                border-radius: 2px;
            }

            /* Page-load hero entrance */
            @keyframes heroIn {
                from {
                    opacity: 0;
                    transform: translateY(40px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .hero-enter {
                animation: heroIn 0.9s ease forwards;
            }
            .hero-enter-1 {
                animation: heroIn 0.9s 0.1s ease both;
            }
            .hero-enter-2 {
                animation: heroIn 0.9s 0.25s ease both;
            }
            .hero-enter-3 {
                animation: heroIn 0.9s 0.4s ease both;
            }
            .hero-enter-4 {
                animation: heroIn 0.9s 0.55s ease both;
            }
            .hero-enter-5 {
                animation: heroIn 0.9s 0.7s ease both;
            }

            /* Loading overlay */
            #loader {
                position: fixed;
                inset: 0;
                background: var(--bg-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                transition: opacity 0.6s;
            }
            @keyframes loaderSpin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .loader-ring {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                border: 4px solid rgba(245, 158, 11, 0.15);
                border-top-color: var(--gold);
                animation: loaderSpin 0.9s linear infinite;
            }

            /* Wave divider */
            .wave-divider svg {
                display: block;
            }

            /* Mobile menu */
            .mobile-menu {
                background: var(--bg-card);
                border-top: 1px solid var(--border);
            }

            /* Ripple on buttons */
            .ripple-btn {
                position: relative;
                overflow: hidden;
            }
            .ripple-btn .ripple {
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.3);
                transform: scale(0);
                animation: ripple-anim 0.6s linear;
                pointer-events: none;
            }
            @keyframes ripple-anim {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }

            /* Glowing border on hero image */
            .hero-img-wrap {
                position: relative;
            }
            .hero-img-wrap::before {
                content: "";
                position: absolute;
                inset: -2px;
                border-radius: 20px;
                background: linear-gradient(
                    135deg,
                    #f59e0b44,
                    transparent 60%,
                    #f59e0b22
                );
                z-index: 0;
            }
            .hero-img-wrap > * {
                position: relative;
                z-index: 1;
            }

            /* Section backgrounds */
            .section-dark {
                background-color: var(--bg-primary);
            }
            .section-alt {
                background-color: var(--bg-secondary);
            }

            /* Progress bar top */
            #progress-bar {
                position: fixed;
                top: 0;
                left: 0;
                height: 3px;
                background: linear-gradient(to right, #f59e0b, #fbbf24);
                z-index: 9999;
                transition: width 0.1s;
                width: 0%;
            }

            /* Back to top */
            #back-top {
                position: fixed;
                bottom: 28px;
                right: 28px;
                z-index: 999;
                width: 46px;
                height: 46px;
                border-radius: 12px;
                background: var(--gold);
                color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 0.4s,
                    transform 0.4s,
                    box-shadow 0.3s;
                box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
                border: none;
            }
            #back-top.show {
                opacity: 1;
                transform: translateY(0);
            }
            #back-top:hover {
                box-shadow: 0 8px 24px rgba(245, 158, 11, 0.6);
                transform: translateY(-3px);
            }

            /* Toast */
            #toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(80px);
                background: var(--gold);
                color: #000;
                font-weight: 700;
                padding: 14px 28px;
                border-radius: 14px;
                box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
                z-index: 9998;
                transition:
                    transform 0.5s cubic-bezier(0.22, 0.68, 0, 1.2),
                    opacity 0.5s;
                opacity: 0;
                white-space: nowrap;
            }
            #toast.show {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        </style>
    </head>

    <body class="dark" x-data="App()" x-init="init()">
        <!-- Progress Bar -->
        <div id="progress-bar"></div>

        <!-- Loading Overlay -->
        <div id="loader">
            <div style="text-align: center">
                <div class="loader-ring" style="margin: 0 auto 16px"></div>
                <div
                    style="
                        color: var(--gold);
                        font-size: 13px;
                        font-weight: 700;
                        letter-spacing: 0.15em;
                    "
                >
                    MEMUAT DATA...
                </div>
            </div>
        </div>

        <!-- Back to Top -->
        <button
            id="back-top"
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
            title="Kembali ke atas"
        >
            <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
            >
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>

        <!-- Toast -->
        <div id="toast">✓ Pesan berhasil dikirim!</div>

        <!-- NAVBAR -->
        <nav class="nav-fixed" id="navbar">
            <div style="max-width: 1280px; margin: 0 auto; padding: 0 24px">
                <div
                    style="
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 14px 0;
                    "
                >
                    <!-- Logo -->
                    <a
                        href="#beranda"
                        style="
                            display: flex;
                            align-items: center;
                            gap: 12px;
                            text-decoration: none;
                        "
                    >
                        <div
                            style="
                                width: 46px;
                                height: 46px;
                                border-radius: 12px;
                                background: var(--gold);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                position: relative;
                                flex-shrink: 0;
                            "
                            class="pulse-badge"
                        >
                            <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                            >
                                <path
                                    d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"
                                    fill="#000"
                                    opacity="0.85"
                                />
                                <path
                                    d="M12 6L6 9.5v3.5c0 3.5 2.5 6.75 6 7.5 3.5-.75 6-4 6-7.5V9.5L12 6z"
                                    fill="none"
                                    stroke="#fff"
                                    stroke-width="1.5"
                                />
                            </svg>
                            <div
                                style="
                                    position: absolute;
                                    top: -4px;
                                    right: -4px;
                                    width: 12px;
                                    height: 12px;
                                    background: #ef4444;
                                    border-radius: 50%;
                                    border: 2px solid var(--bg-primary);
                                "
                            ></div>
                        </div>
                        <div>
                            <div
                                x-text="s.site?.subtitle || ''"
                                style="
                                    font-size: 10px;
                                    font-weight: 700;
                                    color: var(--gold);
                                    letter-spacing: 0.15em;
                                    text-transform: uppercase;
                                "
                            ></div>
                            <div

        <script>
            function App() {
                return {
                    s: {},
                    isDark: true,
                    mobileOpen: false,

                    async init() {
                        // Load settings.json
                        try {
                            const res = await fetch("./settings.json");
                            this.s = await res.json();
                        } catch (e) {
                            console.warn(
                                "settings.json not found, using empty data",
                                e,
                            );
                            this.s = {};
                        }

                        // Theme from localStorage
                        const saved =
                            localStorage.getItem("lapas-theme") || "dark";
                        this.isDark = saved === "dark";
                        this.applyTheme();

                        // After data loaded, trigger DOM setup
                        this.$nextTick(() => {
                            hideLoader();
                            initScrollAnimations();
                            initCounters();
                            initParticles();
                            initProgressBar();
                            initBackTop();
                            initNavScroll();
                            initSmoothScroll();
                        });
                    },

                    toggleTheme() {
                        this.isDark = !this.isDark;
                        this.applyTheme();
                        localStorage.setItem(
                            "lapas-theme",
                            this.isDark ? "dark" : "light",
                        );
                    },

                    applyTheme() {
                        document.body.classList.toggle("dark", this.isDark);
                        document.body.classList.toggle("light", !this.isDark);
                    },

                    ripple(e) {
                        const btn = e.currentTarget;
                        const r = document.createElement("span");
                        const rect = btn.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        r.className = "ripple";
                        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px;`;
                        btn.appendChild(r);
                        setTimeout(() => r.remove(), 700);
                    },

                    getIcon(name) {
                        const icons = {
                            users: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,

            /* ===== Loader ===== */
            function hideLoader() {
                const loader = document.getElementById("loader");
                setTimeout(() => {
                    loader.style.opacity = "0";
                    setTimeout(() => (loader.style.display = "none"), 600);
                }, 700);
            }

            /* ===== Scroll Animations ===== */
            function initScrollAnimations() {
                const targets = document.querySelectorAll(
                    ".anim-fade, .anim-left, .anim-right, .anim-scale, .anim-flip",
                );
                const obs = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((e) => {
                            if (e.isIntersecting) {
                                e.target.classList.add("visible");
                                obs.unobserve(e.target);
                            }
                        });
                    },
                    { threshold: 0.1, rootMargin: "0px 0px -40px 0px" },
                );
                targets.forEach((t) => obs.observe(t));
            }

            /* ===== Counter ===== */
            function initCounters() {
                const obs = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((e) => {
                            if (e.isIntersecting && !e.target.dataset.done) {
                                e.target.dataset.done = "1";
                                const target = parseInt(
                                    e.target.dataset.target,
                                );
                                const dur = 2000;
                                const start = performance.now();
                                const tick = (now) => {
                                    const p = Math.min((now - start) / dur, 1);
                                    const ease = 1 - Math.pow(1 - p, 3);
                                    e.target.textContent = Math.floor(
                                        ease * target,
                                    );
                                    if (p < 1) requestAnimationFrame(tick);
                                    else e.target.textContent = target;
                                };
                                requestAnimationFrame(tick);
                            }
                        });
                    },
                    { threshold: 0.5 },
                );
                document
                    .querySelectorAll(".counter")
                    .forEach((el) => obs.observe(el));
            }

            /* ===== Particles ===== */
            function initParticles() {
                const canvas = document.getElementById("particles");
                const ctx = canvas.getContext("2d");
                let W = (canvas.width = window.innerWidth);
                let H = (canvas.height = window.innerHeight);
                window.addEventListener("resize", () => {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                });

                const particles = Array.from({ length: 55 }, () => ({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.8 + 0.4,
                    dx: (Math.random() - 0.5) * 0.35,
                    dy: (Math.random() - 0.5) * 0.35,
                    o: Math.random() * 0.5 + 0.1,
                }));

                function draw() {
                    ctx.clearRect(0, 0, W, H);
                    const isDarkMode = document.body.classList.contains("dark");
                    particles.forEach((p) => {
                        p.x += p.dx;
                        p.y += p.dy;
                        if (p.x < 0 || p.x > W) p.dx *= -1;
                        if (p.y < 0 || p.y > H) p.dy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = isDarkMode
                            ? `rgba(245,158,11,${p.o})`
                            : `rgba(245,158,11,${p.o * 0.5})`;
                        ctx.fill();
                    });
                    // Draw connecting lines
                    particles.forEach((a, i) => {
                        particles.slice(i + 1).forEach((b) => {
                            const dist = Math.hypot(a.x - b.x, a.y - b.y);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                const alpha =
                                    (1 - dist / 120) *
                                    (isDarkMode ? 0.12 : 0.06);
                                ctx.strokeStyle = `rgba(245,158,11,${alpha})`;
                                ctx.lineWidth = 0.8;
                                ctx.stroke();
                            }
                        });
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }

            /* ===== Progress Bar ===== */
            function initProgressBar() {
                const bar = document.getElementById("progress-bar");
                window.addEventListener("scroll", () => {
                    const pct =
                        (window.scrollY /
                            (document.body.scrollHeight - window.innerHeight)) *
                        100;
                    bar.style.width = pct + "%";
                });
            }

            /* ===== Back To Top ===== */
            function initBackTop() {
                const btn = document.getElementById("back-top");
                window.addEventListener("scroll", () => {
                    btn.classList.toggle("show", window.scrollY > 400);
                });
            }

            /* ===== Nav Scroll ===== */
            function initNavScroll() {
                const nav = document.getElementById("navbar");
                window.addEventListener("scroll", () => {
                    nav.classList.toggle("nav-scrolled", window.scrollY > 50);
                });
            }

            /* ===== Smooth Scroll ===== */
            function initSmoothScroll() {
                document.querySelectorAll('a[href^="#"]').forEach((a) => {
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        const t = document.querySelector(
                            a.getAttribute("href"),
                        );
                        if (t)
                            window.scrollTo({
                                top:
                                    t.getBoundingClientRect().top +
                                    window.scrollY -
                                    80,
                                behavior: "smooth",
                            });
                    });
                });
            }

            /* ===== Toast ===== */
            function showToast(e) {
                e.preventDefault();
                const t = document.getElementById("toast");
                t.classList.add("show");
                setTimeout(() => t.classList.remove("show"), 3500);
            }
