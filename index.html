<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link

            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'%3E%3Cpath d='M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z'/%3E%3C/svg%3E"
        />

        <script

        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="src/style.css" />
    </head>
    <body class="light" x-data="App()" x-init="init()">
        <div id="progress-bar"></div>
        <div id="loader">
            <div style="text-align: center">
                <div class="loader-ring" style="margin: 0 auto 16px"></div>
                <div
                    style="
                        color: var(--gold);
                        font-size: 13px;
                        font-weight: 700;
                        letter-spacing: 0.15em;
                    "
                >
                    MEMUAT DATA...
                </div>
            </div>
        </div>
        <button
            id="back-top"
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
            title="Kembali ke atas"
        >
            <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
            >
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>
        <div id="toast">✓ Pesan berhasil dikirim!</div>
        <nav
            class="nav-fixed"
            id="navbar"
            x-data="{ mobileOpen: false }"
            @click.away="mobileOpen = false"
        >
            <div class="max-w-[1280px] mx-auto px-2 md:px-6">
                <div class="flex items-center justify-between py-3 md:py-4">
                    <a
                        href="#beranda"
                        class="flex items-center gap-3 no-underline group"
                        ><div
                            class="relative w-10 h-10 md:w-11 md:h-11 rounded-xl bg-[var(--gold)] flex items-center justify-center shrink-0 pulse-badge shadow-lg transition-transform group-hover:scale-105"
                        >
                            <svg
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                class="md:w-6 md:h-6"
                            >
                                <path
                                    d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"
                                    fill="#000"
                                    opacity="0.85"
                                />
                                <path
                                    d="M12 6L6 9.5v3.5c0 3.5 2.5 6.75 6 7.5 3.5-.75 6-4 6-7.5V9.5L12 6z"
                                    fill="none"
                                    stroke="#fff"
                                    stroke-width="1.5"
                                />
                            </svg>
                            <div
                                class="absolute -top-1 -right-1 w-2.5 h-2.5 md:w-3 md:h-3 bg-red-500 rounded-full border-2 border-[var(--bg-primary)]"
                            ></div>
                        </div>
                        <div>
                            <div
                                x-text="s.site?.subtitle || ''"
                                class="text-[9px] md:text-[10px] font-bold tracking-[0.15em] uppercase text-[var(--gold)]"
                            ></div>
                            <div
                                x-text="s.site?.title || ''"
                                class="text-sm md:text-base font-extrabold text-[var(--text-primary)] leading-tight"
                            ></div></div
                    ></a>
                    <div class="hidden md:flex items-center gap-6 lg:gap-8">
                        <template x-for="link in s.nav || []" :key="link.href"
                            ><a
                                :href="link.href"
                                x-text="link.label"
                                class="nav-link text-sm font-medium transition-all duration-300 hover:text-[var(--gold)] relative after:absolute after:bottom-0 after:left-0 after:w-0 after:h-0.5 after:bg-[var(--gold)] after:transition-all after:duration-300 hover:after:w-full"
                            ></a></template
                        ><button
                            @click="toggleTheme()"
                            class="theme-toggle hidden md:flex"
                            :title="isDark ? 'Switch to Light' : 'Switch to Dark'"
                        >
                            <div class="theme-toggle-thumb">
                                <span
                                    x-text="isDark ? '🌙' : '☀️'"
                                    class="text-xs leading-none"
                                ></span>
                            </div>
                        </button>
                    </div>
                    <div class="flex md:hidden items-center gap-3">
                        <button
                            @click="toggleTheme()"
                            class="w-8 h-4 rounded-full border border-[var(--gold)] bg-transparent relative cursor-pointer transition-all duration-300 flex items-center p-0.5"
                        >
                            <div
                                class="w-3.5 h-3.5 rounded-full bg-[var(--gold)] flex items-center justify-center transition-transform duration-300"
                                :class="{ 'translate-x-3.5': !isDark, 'translate-x-0': isDark }"
                            >
                                <span
                                    x-text="isDark ? '🌙' : '☀️'"
                                    class="text-[7px] leading-none"
                                ></span>
                            </div></button
                        ><button
                            @click="mobileOpen = !mobileOpen"
                            class="rounded-lg transition-colors hover:bg-white/10"
                            aria-label="Menu"
                        >
                            <svg
                                x-show="!mobileOpen"
                                width="22"
                                height="22"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                viewBox="0 0 24 24"
                            >
                                <path d="M4 6h16M4 12h16M4 18h16" /></svg
                            ><svg
                                x-show="mobileOpen"
                                x-cloak
                                width="22"
                                height="22"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                viewBox="0 0 24 24"
                            >
                                <path d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div
                x-show="mobileOpen"
                x-cloak
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 -translate-y-4"
                x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100 translate-y-0"
                x-transition:leave-end="opacity-0 -translate-y-4"
                class="md:hidden bg-[var(--bg-card)] border-t border-[var(--border)] shadow-lg absolute left-0 right-0 top-full z-50"
            >
                <div class="px-5 py-4 flex flex-col gap-2">
                    <template x-for="link in s.nav || []" :key="link.href"
                        ><a
                            :href="link.href"
                            x-text="link.label"
                            @click="mobileOpen = false"
                            class="nav-link py-3 px-4 rounded-xl text-base font-medium hover:bg-[var(--gold)]/10 hover:text-[var(--gold)] transition-all duration-200 border-b border-[var(--border)] last:border-0"
                        ></a
                    ></template>
                </div>
            </div>
        </nav>
        <style>
            /* Navbar scroll effect */
            .nav-fixed.nav-scrolled {
                backdrop-filter: blur(16px);
                background-color: rgba(var(--bg-primary-rgb), 0.92) !important;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            }
            body.dark .nav-fixed.nav-scrolled {
                background-color: rgba(10, 15, 30, 0.92) !important;
            }
            body.light .nav-fixed.nav-scrolled {
                background-color: rgba(248, 249, 252, 0.92) !important;
            } /* Theme toggle smooth animation */
            .theme-toggle {
                transition: background-color 0.2s;
            }
            .theme-toggle:hover {
                background-color: rgba(245, 158, 11, 0.2);
            } /* Mobile menu item active state */
            .mobile-menu a:active {
                transform: scale(0.98);
            }</style
        ><canvas
            id="particles"
            style="position: fixed; inset: 0; pointer-events: none; z-index: 1"
        ></canvas>
        <section
            id="beranda"
            class="relative min-h-screen flex items-center pt-20 overflow-hidden"
            style="background: var(--hero-gradient)"
        >
            <div
                class="absolute top-1/2 -left-[120px] w-[500px] h-[500px] rounded-full border pointer-events-none"
                style="
                    border-color: rgba(245, 158, 11, 0.08);
                    transform: translateY(-50%);
                "
            ></div>
            <div
                class="absolute top-1/2 -left-[80px] w-[350px] h-[350px] rounded-full border pointer-events-none spin-slow"
                style="
                    border-color: rgba(245, 158, 11, 0.06);
                    transform: translateY(-50%);
                "
            ></div>
            <div
                class="container max-w-[1280px] mx-auto px-6 py-10 md:py-12 relative z-10 grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-16 items-center"
            >
                <div>
                    <div
                        class="hero-enter-1 inline-flex items-center gap-2 border rounded-full px-4 py-2 mb-7"
                        style="
                            border-color: rgba(245, 158, 11, 0.4);
                            background: rgba(245, 158, 11, 0.05);
                        "
                    >
                        <div
                            class="w-2 h-2 rounded-full bg-[var(--gold)] pulse-badge"
                        ></div>
                        <span
                            x-text="s.hero?.badge || ''"
                            class="text-[11px] font-bold tracking-[0.18em] uppercase text-[var(--text-primary)]"
                        ></span>
                    </div>
                    <h1
                        class="hero-enter-2 text-4xl sm:text-5xl md:text-6xl font-black leading-tight mb-4"
                    >
                        <span
                            x-text="s.hero?.title || ''"
                            class="block text-[var(--text-primary)]"
                        ></span
                        ><span
                            x-text="s.hero?.titleHighlight || ''"
                            class="block text-[var(--gold)]"
                        ></span>
                    </h1>
                    <p
                        class="hero-enter-3 text-lg font-semibold text-[var(--text-primary)] mb-2"
                    >
                        <span x-text="(s.hero?.tagline || '') + ' '"></span
                        ><span
                            x-text="s.hero?.taglineHighlight || ''"
                            class="text-[var(--gold)]"
                        ></span
                        ><span
                            x-text="' ' + (s.hero?.taglineSuffix || '')"
                        ></span>
                    </p>
                    <div class="divider-gold hero-enter-3 mb-6"></div>
                    <p
                        class="hero-enter-4 text-[15px] leading-relaxed text-[var(--text-secondary)] max-w-[520px] mb-9"
                        x-text="s.hero?.description || ''"
                    ></p>
                    <div class="hero-enter-5 flex flex-wrap gap-4">
                        <a
                            :href="s.hero?.ctaPrimary?.href || '#'"
                            class="btn-primary ripple-btn inline-flex items-center gap-2"
                            @click="ripple($event)"
                            ><span
                                x-text="s.hero?.ctaPrimary?.label || ''"
                            ></span
                            ><svg
                                width="18"
                                height="18"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                            >
                                <path d="M5 12h14M12 5l7 7-7 7" /></svg></a
                        ><a
                            :href="s.hero?.ctaSecondary?.href || '#'"
                            class="btn-secondary ripple-btn inline-flex items-center gap-2"
                            @click="ripple($event)"
                            ><svg
                                width="18"
                                height="18"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.64A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"
                                /></svg
                            ><span
                                x-text="s.hero?.ctaSecondary?.label || ''"
                            ></span
                        ></a>
                    </div>
                </div>
                <div class="hero-float hero-enter-2 relative hidden md:block">
                    <div
                        class="relative rounded-2xl overflow-hidden shadow-2xl"
                    >
                        <div class="aspect-[4/3] w-full">
                            <img
                                :src="s.hero?.heroImage || ''"
                                :alt="s.hero?.titleHighlight || ''"
                                class="w-full h-full object-cover"
                            />
                        </div>
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"
                        ></div>
                        <div
                            class="absolute bottom-4 left-4 flex items-center gap-3 bg-black/70 backdrop-blur-md rounded-xl px-4 py-2.5 border"
                            style="border-color: rgba(245, 158, 11, 0.3)"
                        >
                            <div
                                class="w-8 h-8 rounded-lg bg-[var(--gold)] flex items-center justify-center shrink-0"
                            >
                                <svg
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                >
                                    <path
                                        d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"
                                        fill="#000"
                                    />
                                </svg>
                            </div>
                            <div>
                                <div
                                    x-text="s.hero?.heroBadgeLabel || ''"
                                    class="text-[10px] font-bold tracking-[0.15em] uppercase text-[var(--gold)]"
                                ></div>
                                <div
                                    x-text="s.hero?.heroBadgeText || ''"
                                    class="text-white font-bold text-sm"
                                ></div>
                            </div>
                        </div>
                    </div>
                    <div
                        class="absolute -top-3 -right-3 w-16 h-16 opacity-30 pointer-events-none hidden lg:block"
                        style="
                            background-image: radial-gradient(
                                circle,
                                var(--gold) 1.5px,
                                transparent 1.5px
                            );
                            background-size: 12px 12px;
                        "
                    ></div>
                    <div
                        class="absolute -bottom-3 -left-3 w-14 h-14 opacity-20 pointer-events-none hidden lg:block"
                        style="
                            background-image: radial-gradient(
                                circle,
                                var(--gold) 1.5px,
                                transparent 1.5px
                            );
                            background-size: 10px 10px;
                        "
                    ></div>
                </div>
            </div>
        </section>
        <section class="section-alt" style="padding: 80px 24px">
            <div style="max-width: 1280px; margin: 0 auto">
                <div
                    style="
                        display: grid;
                        grid-template-columns: repeat(4, 1fr);
                        gap: 16px;
                    "
                    class="stats-grid"
                >
                    <template x-for="(stat, i) in s.stats || []" :key="i"
                        ><div
                            class="data-card anim-fade"
                            :class="['d'+(i+1), stat.active ? 'active' : '']"
                            style="padding: 28px"
                        >
                            <div
                                class="icon-box-sm"
                                style="margin-bottom: 16px"
                            >
                                <span
                                    x-html="getIcon(stat.icon)"
                                    style="color: var(--gold)"
                                ></span>
                            </div>
                            <div class="stat-num" style="margin-bottom: 4px">
                                <span class="counter" :data-target="stat.value"
                                    >0</span
                                ><span x-text="stat.suffix || ''"></span>
                            </div>
                            <div
                                x-text="stat.label"
                                style="
                                    color: var(--text-secondary);
                                    font-size: 13px;
                                    font-weight: 500;
                                    line-height: 1.4;
                                "
                            ></div></div
                    ></template>
                </div>
            </div>
        </section>
        <section id="profil" class="section-dark py-24 px-6">
            <div
                class="max-w-[1280px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-center"
            >
                <div class="anim-left grid grid-cols-2 gap-3">
                    <template
                        x-for="(img, i) in s.profil?.images || []"
                        :key="i"
                        ><div
                            :class="i === 0 ? 'col-span-2 h-48 md:h-56' : 'h-36 md:h-40'"
                            class="gallery-item overflow-hidden rounded-xl"
                        >
                            <img
                                :src="img"
                                :alt="s.profil?.title || ''"
                                class="w-full h-full object-cover"
                            /></div
                    ></template>
                </div>
                <div class="anim-right">
                    <div
                        class="section-label mb-2"
                        x-text="s.profil?.sectionLabel || ''"
                    ></div>
                    <h2
                        class="text-3xl md:text-4xl lg:text-5xl font-black leading-tight mb-6 text-[var(--text-primary)]"
                    >
                        <span x-text="(s.profil?.title || '') + ' '"></span
                        ><span
                            x-text="s.profil?.titleHighlight || ''"
                            class="text-[var(--gold)]"
                        ></span>
                    </h2>
                    <template x-for="p in s.profil?.paragraphs || []" :key="p"
                        ><p
                            class="text-[15px] leading-relaxed text-[var(--text-secondary)] mb-4"
                            x-text="p"
                        ></p
                    ></template>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8">
                        <template
                            x-for="card in s.profil?.infoCards || []"
                            :key="card.label"
                            ><div
                                class="data-card p-4 text-center sm:text-left"
                            >
                                <div
                                    class="icon-box-sm w-9 h-9 mb-2 mx-auto sm:mx-0"
                                >
                                    <span
                                        x-html="getIcon(card.icon)"
                                        class="text-[var(--gold)]"
                                    ></span>
                                </div>
                                <div
                                    x-text="card.label"
                                    class="text-[10px] font-bold tracking-wide uppercase text-[var(--text-muted)] mb-1"
                                ></div>
                                <div
                                    x-text="card.value"
                                    class="font-bold text-sm text-[var(--text-primary)]"
                                ></div></div
                        ></template>
                    </div>
                </div>
            </div>
        </section>
        <section class="section-alt" style="padding: 96px 24px">
            <div style="max-width: 1280px; margin: 0 auto">
                <div
                    class="anim-fade"
                    style="text-align: center; margin-bottom: 56px"
                >
                    <div
                        class="section-label"
                        style="margin-bottom: 10px"
                        x-text="s.visiMisi?.sectionLabel || ''"
                    ></div>
                    <h2
                        style="
                            font-size: clamp(2.2rem, 4vw, 3rem);
                            font-weight: 900;
                            color: var(--text-primary);
                        "
                    >
                        <span x-text="(s.visiMisi?.title || '') + ' '"></span
                        ><span
                            x-text="s.visiMisi?.titleHighlight || ''"
                            style="color: var(--gold)"
                        ></span>
                    </h2>
                    <div class="divider-gold" style="margin: 16px auto 0"></div>
                </div>
                <div
                    class="anim-fade d1"
                    style="
                        background: var(--card-gradient);
                        border: 1px solid var(--border-card);
                        border-radius: 20px;
                        padding: 36px;
                        margin-bottom: 24px;
                    "
                >
                    <div
                        style="
                            display: flex;
                            align-items: flex-start;
                            gap: 20px;
                        "
                    >
                        <div class="icon-box" style="flex-shrink: 0">
                            <svg
                                width="26"
                                height="26"
                                fill="none"
                                stroke="#000"
                                stroke-width="2"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </div>
                        <div>
                            <div
                                class="section-label"
                                style="margin-bottom: 10px"
                            >
                                VISI
                            </div>
                            <p
                                x-text="s.visiMisi?.visi || ''"
                                style="
                                    font-size: clamp(1rem, 1.8vw, 1.25rem);
                                    font-weight: 700;
                                    color: var(--text-primary);
                                    line-height: 1.65;
                                "
                            ></p>
                        </div>
                    </div>
                </div>
                <div
                    style="
                        display: grid;
                        grid-template-columns: repeat(3, 1fr);
                        gap: 14px;
                    "
                    class="misi-grid"
                >
                    <template x-for="(m, i) in s.visiMisi?.misi || []" :key="i"
                        ><div
                            class="data-card anim-flip"
                            :class="'d'+(i+1)"
                            style="padding: 24px"
                        >
                            <div class="icon-box" style="margin-bottom: 16px">
                                <span
                                    x-html="getIcon(m.icon)"
                                    style="color: #000"
                                ></span>
                            </div>
                            <div
                                x-text="m.label"
                                style="
                                    font-size: 10px;
                                    font-weight: 700;
                                    color: var(--gold);
                                    letter-spacing: 0.15em;
                                    margin-bottom: 8px;
                                "
                            ></div>
                            <p
                                x-text="m.text"
                                style="
                                    color: var(--text-secondary);
                                    font-size: 13px;
                                    line-height: 1.65;
                                "
                            ></p></div
                    ></template>
                </div>
            </div>
        </section>
        <section id="layanan" class="section-dark" style="padding: 96px 24px">
            <div style="max-width: 1280px; margin: 0 auto">
                <div class="anim-fade" style="margin-bottom: 56px">
                    <div
