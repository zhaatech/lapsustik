name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # atau branch utama Anda (master)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact from ./build folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'   # folder yang berisi index.html Anda

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
